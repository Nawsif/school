<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c">
<title>Government Study Set</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#252a33;--line:#343944;--muted:#a0a8b6;--text:#e9edf4;--purple:#4b75b8;--green:#73c595;--red:#f08a8a;--shadow:0 2px 9px #00000020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Arial,Helvetica,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4f7dbf;outline-offset:2px}
.shell{max-width:980px;margin:auto;padding:22px 24px 55px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:29px}.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brandicon{display:none}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 24px}h1{font-size:31px;font-weight:700;letter-spacing:-.8px;margin:0 0 6px}
.pill,.btn,.navbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:9px 14px;font-weight:600}.pill:hover,.btn:hover,.navbtn:hover{background:var(--panel2)}.primary{background:var(--purple);border-color:var(--purple);color:white}.primary:hover{background:#375f9a}.secondary{background:var(--panel)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.stat{padding:13px 16px;background:var(--panel);border:1px solid var(--line);border-radius:7px}.stat b{font-size:22px;font-weight:700;display:block}.stat span{color:var(--muted);font-size:12px}
.modes{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}.mode{border:0;border-bottom:2px solid transparent;background:none;padding:11px 18px;color:var(--muted);white-space:nowrap;text-align:center;font-weight:600}.mode span:first-child,.mode small{display:none}.mode strong{font-size:14px}.mode.active{color:var(--purple);border-bottom-color:var(--purple)}.mode:hover{color:var(--text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.studyhead{margin-bottom:17px}.sectionTitle{font-size:20px;margin:0 0 3px}.kicker{font-size:12px;color:var(--muted)}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.select{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 11px;max-width:100%}.bar{height:5px;background:#303640;border-radius:5px;overflow:hidden;margin:11px 0 21px}.fill{height:100%;background:var(--purple)}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}
.flashcard{min-height:295px;padding:45px 30px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:20px;position:relative;cursor:pointer}.flashcard:hover{border-color:#627087}.flashcard .badge{position:absolute;top:18px;left:20px;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.7px}.flashcard .big{font-size:clamp(19px,3.5vw,27px);font-weight:600;line-height:1.5;max-width:720px;white-space:pre-line}.flashcard .hint{position:absolute;bottom:16px;color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0}.navbtn{min-width:45px}.learned,.done{color:var(--green)!important}
.quiz{padding:23px}.question{font-size:22px;font-weight:600;line-height:1.4;margin:18px 0 23px}.answers{display:grid;gap:9px}.answer{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 15px;color:var(--text)}.answer:hover:not(:disabled){background:#293448;border-color:#6c8dbd}.answer.correct{background:#19392c;border-color:#4c996a}.answer.wrong{background:#442727;border-color:#c66f6f}.result{margin-top:18px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:14px;line-height:1.6}.result strong{display:block}.result.right strong{color:var(--green)}.result.bad strong{color:var(--red)}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.field{display:block;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:13px 14px}.muted{color:var(--muted)}.list{display:grid;gap:9px}.listitem{display:grid;grid-template-columns:32px 1fr auto;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:7px;align-items:start}.listitem .num{font-size:13px;color:var(--muted)}.listitem strong{display:block;margin-bottom:6px}.answertext{color:#b5becc;line-height:1.5}.check{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:8px 10px;color:var(--text)}.empty,.end{text-align:center;padding:35px 20px}.end h2{font-size:25px}.notice{font-size:12px;line-height:1.5;color:var(--muted);margin-top:32px}.hide{display:none!important}
@media(max-width:660px){.shell{padding:17px 14px 40px}h1{font-size:26px}.top{margin-bottom:22px}.modes{gap:0}.mode{padding:10px 12px;flex:1}.mode strong{font-size:13px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:19px}.flashcard{min-height:265px;padding:44px 18px}.quiz{padding:17px}.question{font-size:19px}.listitem{grid-template-columns:26px 1fr}.listitem .check{grid-column:2;justify-self:start}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">Government Review</div><button id="reset" class="pill" title="Reset mastered questions and quiz record">Reset progress</button></header>
<p class="eyebrow">Advanced U.S. Government & Politics</p><h1>Foundational Principles</h1><p class="subtitle">36 questions from your test review</p>
<section class="stats"><div class="stat"><b id="masteredCount">0/36</b><span>Mastered</span></div><div class="stat"><b id="bestScore">—</b><span>Best test score</span></div><div class="stat"><b id="remainingCount">36</b><span>Still to master</span></div></section>
<div class="modes" role="tablist" aria-label="Study modes"><button class="mode active" data-mode="flash" role="tab"><span>▣</span><span><strong>Flashcards</strong><small>Flip & remember</small></span></button><button class="mode" data-mode="learn" role="tab"><span>◎</span><span><strong>Learn</strong><small>Multiple choice</small></span></button><button class="mode" data-mode="write" role="tab"><span>✎</span><span><strong>Write</strong><small>Recall the answer</small></span></button><button class="mode" data-mode="list" role="tab"><span>☷</span><span><strong>All terms</strong><small>Search the set</small></span></button></div>
<div class="row studyhead"><div><h2 id="modeTitle" class="sectionTitle">Flashcards</h2><div class="kicker" id="modeSubtitle">Click a card to reveal the answer.</div></div><div class="settings"><select id="category" class="select" aria-label="Category"><option value="all">All topics</option><option value="history">Documents & philosophers</option><option value="convention">Constitutional Convention</option><option value="articles">Constitution articles</option><option value="powers">Powers & clauses</option><option value="principles">Government principles</option></select><label class="kicker"><input id="unmastered" type="checkbox"> Only unmastered</label><button id="shuffle" class="pill">Shuffle</button></div></div>
<div id="progressLabel" class="row kicker"><span id="position">Card 1 of 36</span><span id="counter">0 mastered</span></div><div class="bar" id="progressBar"><div id="progressFill" class="fill"></div></div>
<section id="flashPanel"><div id="flashcard" class="card flashcard" tabindex="0" role="button" aria-label="Flip flashcard"><div class="badge" id="cardSide">QUESTION</div><div class="big" id="cardText"></div><div class="hint">Click to show answer</div></div><div class="controls"><button id="prev" class="navbtn" aria-label="Previous card">←</button><button id="mark" class="btn secondary">Mark as mastered</button><button id="next" class="navbtn" aria-label="Next card">→</button></div><p class="muted" style="text-align:center;font-size:12px">Use ← and → to switch cards</p></section>
<section id="quizPanel" class="hide"><div id="quizContent"></div></section>
<section id="writePanel" class="hide"><div id="writeContent"></div></section>
<section id="listPanel" class="hide"><input id="search" class="field" placeholder="Search questions or answers..." aria-label="Search questions" style="margin-bottom:14px"><div class="list" id="termList"></div></section>

</main>
<script>
const raw=[
[1,'What are basic rights held by Americans today that can be found in Magna Carta?','Due process, trial by jury, and protection from unlawful imprisonment.','history'],
[2,'Magna Carta laid the foundation for ______ in England.','Constitutional government (limited government).','history'],
[3,'What was the importance of the Mayflower Compact?','Established self-government and majority rule.','history'],
[4,'What rights are included in the English Bill of Rights?','Freedom of speech in Parliament, right to petition, free elections, and protection from cruel and unusual punishment and excessive bail.','history'],
[5,'Which philosopher played a major role in the development of the English Bill of Rights?','John Locke.','history'],
[6,'Which French philosopher is associated with separation of powers and checks and balances?','Montesquieu.','history'],
[7,'What Constitutional Principles are found in the Virginia Declaration of Rights?','Popular sovereignty, limited government, individual rights, and separation of powers.','history'],
[8,'Which philosopher had the greatest influence on the Declaration of Independence?','John Locke.','history'],
[9,'Which two of Locke’s ideas appear prominently in the Declaration of Independence?','Natural rights and consent of the governed.','history'],
[10,'Why did the founders design a weak central government in the Articles of Confederation?','They feared a powerful government becoming tyrannical like the British monarchy.','convention'],
[11,'Which plan was the basis of discussion at the Constitutional Convention?','Virginia Plan.','convention'],
[12,'What was the Connecticut, or Great, Compromise?','Created a bicameral Congress with proportional representation in the House and equal representation in the Senate.','convention'],
[13,'What was the three-fifths Compromise?','Counted three-fifths of the enslaved population for representation and direct taxation.','convention'],
[14,'What was the slave trade compromise?','Congress could not ban the international slave trade before 1808.','convention'],
[15,'What was the thing the Constitution lacked that outraged Anti-Federalists?','A Bill of Rights.','convention'],
[16,'What does Article I of the Constitution deal with?','The legislative branch (Congress).','articles'],
[17,'What does Article II of the Constitution deal with?','The executive branch (President).','articles'],
[18,'What does Article III of the Constitution deal with?','The judicial branch (Supreme Court and federal courts).','articles'],
[19,'What does Article IV of the Constitution deal with?','Relations between states.','articles'],
[20,'What does Article V of the Constitution deal with?','The amendment process.','articles'],
[21,'What does Article VI of the Constitution deal with?','Supremacy of federal law.','articles'],
[22,'What does Article VII of the Constitution deal with?','Ratification of the Constitution.','articles'],
[23,'What is an enumerated power?','A power specifically listed in the Constitution.','powers'],
[24,'Who is the President of the Senate?','The Vice President of the United States.','powers'],
[25,'Where must bills raising a revenue originate from?','The House of Representatives.','powers'],
[26,'Explain the Necessary and Proper Clause.','Allows Congress to make laws needed to carry out its enumerated powers.','powers'],
[27,'List three of Congress’s enumerated powers from Article I, Section 8.','Declare war, coin money, and regulate interstate commerce.','powers'],
[28,'Explain the Take Care Clause.','Requires the President to faithfully enforce federal laws.','powers'],
[29,'Explain the Supremacy Clause.','The Constitution and valid federal laws override conflicting state laws.','powers'],
[30,'Explain the Full Faith and Credit Clause.','States must recognize other states’ public records, acts, and judicial proceedings.','powers'],
[31,'Explain the Commerce Clause.','Gives Congress power to regulate trade between states, with foreign nations, and with Native American tribes.','powers'],
[32,'Explain the General Welfare Clause.','Allows Congress to tax and spend money for the common defense and general welfare.','powers'],
[33,'For what can a President be impeached?','Treason, bribery, or other high crimes and misdemeanors.','powers'],
[34,'List three specific examples of Separation of Powers.','Congress makes laws; the President enforces laws; the judicial branch interprets laws.','principles'],
[35,'List three specific examples of Checks and Balances.','The President vetoes laws; Congress overrides vetoes; the Supreme Court declares laws unconstitutional.','principles'],
[36,'List three specific examples of Federalism.','The federal government declares war; states establish public schools; both federal and state governments collect taxes.','principles']
];
const questions=raw.map(([id,q,a,cat])=>({id,q,a,cat}));const $=s=>document.querySelector(s);const storeKey='gov-foundations-study-v1';let stored={};try{stored=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}let mastered=new Set(stored.mastered||[]),best=Number(stored.best||0),mode='flash',order=[],index=0,flipped=false,answered=false,score=0,attempts=0,choices=[];
const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify({mastered:[...mastered],best}))}catch{}};
const shuffleArr=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildOrder(mix=false){let cat=$('#category').value,un=$('#unmastered').checked;let items=questions.filter(x=>(cat==='all'||x.cat===cat)&&(!un||!mastered.has(x.id)));order=mix?shuffleArr(items):items;index=0;flipped=false;answered=false;score=0;attempts=0;render()}
function updateStats(){$('#masteredCount').textContent=`${mastered.size}/36`;$('#remainingCount').textContent=36-mastered.size;$('#bestScore').textContent=best?best+'%':'—';$('#counter').textContent=mastered.size+' mastered'}
function header(){const titles={flash:['Flashcards','Click a card to reveal the answer.'],learn:['Learn','Choose the correct answer for each question.'],write:['Write','Recall it first, then check your answer.'],list:['All terms','Browse the full study set.']};$('#modeTitle').textContent=titles[mode][0];$('#modeSubtitle').textContent=titles[mode][1];$('#position').textContent=order.length?`${mode==='flash'?'Card':'Question'} ${Math.min(index+1,order.length)} of ${order.length}`:'No questions available';$('#progressFill').style.width=(order.length?((mode==='list'?order.length:Math.min(index+(answered?1:0),order.length))/order.length)*100:0)+'%';$('#progressLabel').classList.toggle('hide',mode==='list');$('#progressBar').classList.toggle('hide',mode==='list');['flash','quiz','write','list'].forEach(x=>$('#'+x+'Panel').classList.toggle('hide',x!==(mode==='learn'?'quiz':mode)));document.querySelectorAll('.mode').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))})}
function render(){updateStats();header();if(mode==='flash')renderFlash();if(mode==='learn')renderLearn();if(mode==='write')renderWrite();if(mode==='list')renderList()}
const empty='<div class="card empty">No questions in this selection. Change your filters or reset your mastered progress.</div>';
function renderFlash(){if(!order.length){$('#flashcard').classList.add('hide');$('#mark').disabled=true;$('#prev').disabled=true;$('#next').disabled=true;return}$('#flashcard').classList.remove('hide');$('#mark').disabled=false;$('#prev').disabled=false;$('#next').disabled=false;const q=order[index];$('#cardSide').textContent=flipped?'ANSWER':'QUESTION';$('#cardText').textContent=flipped?q.a:q.q;$('#mark').textContent=mastered.has(q.id)?'Mastered':'Mark as mastered';$('#mark').classList.toggle('learned',mastered.has(q.id))}
function flip(){if(mode!=='flash'||!order.length)return;flipped=!flipped;renderFlash()}
function move(d){if(!order.length)return;index=(index+d+order.length)%order.length;flipped=false;answered=false;render()}
function toggleMaster(id){mastered.has(id)?mastered.delete(id):mastered.add(id);save();if($('#unmastered').checked){let prev=order[index]?.id;order=order.filter(q=>!mastered.has(q.id));index=Math.min(index,Math.max(0,order.length-1));if(prev===id)flipped=false}render()}
function choiceOptions(q){const wrong=shuffleArr(questions.filter(x=>x.id!==q.id&&x.a!==q.a&&(x.cat===q.cat||Math.random()<.4)));const ans=[q,...wrong.slice(0,3)].map(x=>({id:x.id,answer:x.a}));return shuffleArr(ans)}
function completed(target){let pct=attempts?Math.round(score/attempts*100):0;if(mode==='learn'&&pct>best){best=pct;save()}target.innerHTML=`<div class="card end"><h2>Set complete!</h2><p class="muted">You got <strong style="color:var(--text)">${score} of ${attempts}</strong> correct (${pct}%).</p><p class="muted">Keep practicing to master every question.</p><button class="btn primary" id="again">Study again</button></div>`;$('#again').onclick=()=>buildOrder(true);$('#progressFill').style.width='100%';$('#position').textContent='Completed '+order.length+' questions';updateStats()}
function renderLearn(){const host=$('#quizContent');if(!order.length){host.innerHTML=empty;return}if(index>=order.length){completed(host);return}let q=order[index];if(!choices.length||choices._id!==q.id){choices=choiceOptions(q);choices._id=q.id}host.innerHTML=`<div class="card quiz"><div class="kicker">SELECT ONE ANSWER</div><div class="question" id="qText"></div><div id="optionList" class="answers"></div><div id="feedback"></div><div class="foot"><button id="skipQ" class="btn">Skip</button><button id="nextQ" class="btn primary hide">Next question</button></div></div>`;$('#qText').textContent=q.q;const optionList=$('#optionList');choices.forEach((opt,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'.  '+opt.answer;b.onclick=()=>{if(answered)return;answered=true;attempts++;if(opt.id===q.id){score++;mastered.add(q.id)}else mastered.delete(q.id);save();document.querySelectorAll('.answer').forEach((el,j)=>{el.disabled=true;if(choices[j].id===q.id)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});const f=$('#feedback');f.className='result '+(opt.id===q.id?'right':'bad');f.innerHTML=`<strong>${opt.id===q.id?'Correct!':'Not quite'}</strong>`;f.append(document.createTextNode(q.a));$('#nextQ').classList.remove('hide');$('#skipQ').classList.add('hide');updateStats();header()};optionList.append(b)});$('#nextQ').onclick=()=>{index++;answered=false;choices=[];render()};$('#skipQ').onclick=()=>{index++;answered=false;choices=[];render()}}
function renderWrite(){const host=$('#writeContent');if(!order.length){host.innerHTML=empty;return}if(index>=order.length){completed(host);return}const q=order[index];host.innerHTML=`<div class="card quiz"><div class="kicker">WRITE THE ANSWER IN YOUR OWN WORDS</div><div class="question" id="writeQuestion"></div><textarea id="written" class="field" style="resize:vertical;min-height:120px" placeholder="Type what you remember..." aria-label="Your answer"></textarea><div id="writeReveal" class="hide result"><strong>Suggested answer</strong><div id="writeAnswer"></div><p class="muted" style="font-size:13px">Compare your response with the suggested answer, then grade yourself.</p><div class="row"><button id="writeWrong" class="btn">Need more practice</button><button id="writeRight" class="btn primary">I got it</button></div></div><div class="foot"><button id="writeSkip" class="btn">Skip</button><button id="reveal" class="btn primary">Reveal answer</button></div></div>`;$('#writeQuestion').textContent=q.q;$('#writeAnswer').textContent=q.a;$('#reveal').onclick=()=>{$('#writeReveal').classList.remove('hide');$('#reveal').classList.add('hide');$('#writeSkip').classList.add('hide');$('#written').readOnly=true};const grade=correct=>{attempts++;if(correct){score++;mastered.add(q.id)}else mastered.delete(q.id);save();index++;render()};$('#writeRight').onclick=()=>grade(true);$('#writeWrong').onclick=()=>grade(false);$('#writeSkip').onclick=()=>{index++;render()}}
function renderList(){const list=$('#termList');list.replaceChildren();let search=$('#search').value.toLowerCase().trim();const items=order.filter(q=>`${q.q} ${q.a}`.toLowerCase().includes(search));if(!items.length){list.innerHTML='<div class="empty">Nothing found.</div>';return}items.forEach(q=>{const el=document.createElement('div');el.className='listitem';let n=document.createElement('div');n.className='num';n.textContent=q.id+'.';let body=document.createElement('div'),strong=document.createElement('strong'),ans=document.createElement('div');strong.textContent=q.q;ans.textContent=q.a;ans.className='answertext';body.append(strong,ans);let b=document.createElement('button');b.className='check'+(mastered.has(q.id)?' done':'');b.textContent=mastered.has(q.id)?'Mastered':'Master';b.onclick=()=>toggleMaster(q.id);el.append(n,body,b);list.append(el)})}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;choices=[];buildOrder(mode==='learn'||mode==='write')});$('#category').onchange=()=>buildOrder(mode==='learn'||mode==='write');$('#unmastered').onchange=()=>buildOrder(mode==='learn'||mode==='write');$('#shuffle').onclick=()=>{buildOrder(true)};$('#flashcard').onclick=flip;$('#flashcard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#mark').onclick=()=>{if(order.length)toggleMaster(order[index].id)};$('#search').oninput=renderList;$('#reset').onclick=()=>{if(confirm('Reset all mastered questions and your best score?')){mastered.clear();best=0;save();buildOrder()}};window.addEventListener('keydown',e=>{if(mode!=='flash'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.code==='Space'&&document.activeElement===document.body){e.preventDefault();flip()}});buildOrder();
</script></body></html>
